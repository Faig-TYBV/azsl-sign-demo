<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qeydiyyat — Azİşarə</title>
<link rel="icon" type="image/png" href="/static/assets/logo_1.png">
<style>
:root {
    --bg-dark: #333333;
    --bg-deep: #262626;
    --text-light: #EBEBEB;
    --border-muted: #C2B280;
    --accent-cyan: #A0FFFF;
    --state-warning: #FFCC00;
    --state-success: #6B8E23;
    --state-danger: #E0846B;
    --glass-bg: rgba(51, 51, 51, 0.68);
    --glass-border: rgba(194, 178, 128, 0.35);
    --field-bg: rgba(38, 38, 38, 0.75);
    --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
    font-family: var(--font-sans);
    background-color: var(--bg-deep);
    color: var(--text-light);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* ---------- Ambient glow ----------
   Sits below the letters canvas and behind the (transparent) hero column,
   giving it atmospheric depth instead of a flat gray wash. The right
   column paints over this with a solid #050505, so it only ever shows
   through the left side. */
.ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse 70% 65% at 38% 46%, rgba(23, 92, 88, 0.4) 0%, rgba(16, 23, 26, 0.82) 58%, rgba(7, 11, 13, 0.96) 100%),
        radial-gradient(45% 38% at 80% 12%, rgba(255, 204, 0, 0.07) 0%, rgba(255, 204, 0, 0) 70%),
        linear-gradient(180deg, #0b2226 0%, #070b0d 100%);
}

/* ---------- Floating letter field ---------- */
#letter-field {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

/* ---------- Mount animations (vanilla-CSS stand-in for framer-motion's
   initial={{opacity:0,y:20}} / animate={{opacity:1,y:0}}, with a stagger) ---------- */
@keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}
.hero-logo, .hero-brand-name, .login-link, .register-card, .field, .submit-btn, .card-footer {
    animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.hero-logo        { animation-delay: 0s; }
.hero-brand-name  { animation-delay: 0.06s; }
.login-link       { animation-delay: 0.06s; }
.register-card    { animation-delay: 0.1s; }
#field-name       { animation-delay: 0.2s; }
#field-email      { animation-delay: 0.26s; }
#field-password   { animation-delay: 0.32s; }
#field-confirm    { animation-delay: 0.38s; }
.submit-btn       { animation-delay: 0.46s; }
.card-footer      { animation-delay: 0.52s; }

/* ---------- Split shell: transparent hero left, solid pane right ---------- */
.auth-shell {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
}

@media (min-width: 1024px) {
    .auth-shell { grid-template-columns: 1fr 1fr; }
}

/* ---------- Left: brand hero (stays transparent so the floating-letter
   canvas keeps showing straight through it) ---------- */
.hero-panel {
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 3rem 2rem;
    text-align: center;
}

.hero-brand-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    text-decoration: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.hero-brand-link:hover { transform: scale(1.02); opacity: 0.92; }
.hero-brand-link:active { transform: scale(0.96); opacity: 0.85; }

.hero-brand-link:focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 8px;
    border-radius: 18px;
}

.hero-logo {
    height: clamp(150px, 16vw, 220px);
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(126, 251, 227, 0.18));
}

.hero-brand-name {
    font-size: clamp(2.75rem, 6vw, 3.75rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
    filter: drop-shadow(0 0 40px rgba(126, 251, 227, 0.18));
}

.hero-brand-name .accent {
    background: linear-gradient(100deg, #7EFBE3, var(--state-warning));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}

/* ---------- Right: solid registration pane ---------- */
.form-panel {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem clamp(1rem, 5vw, 3rem) 3.5rem;
    background: #050505;
}

@media (min-width: 1024px) {
    .form-panel {
        padding: 3rem;
        border-left: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: -40px 0 80px -40px rgba(0, 0, 0, 0.65);
    }
}

.form-panel .login-link {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
}

.login-link {
    color: var(--border-muted);
    text-decoration: none;
    font-size: 0.97rem;
    font-weight: 600;
    padding: 0.5rem 1.05rem;
    border-radius: 9px;
    border: 1px solid transparent;
    transition: color 0.25s ease-in-out, background-color 0.25s ease-in-out,
                border-color 0.25s ease-in-out, box-shadow 0.25s ease-in-out;
}

.login-link:hover,
.login-link:focus-visible {
    color: var(--text-light);
    background-color: rgba(160, 255, 255, 0.14);
    border-color: rgba(160, 255, 255, 0.4);
    box-shadow: 0 0 16px rgba(160, 255, 255, 0.35);
    outline: none;
}

.login-link:focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
}

/* ---------- Glass card ---------- */
.register-card {
    width: 100%;
    max-width: 470px;
    padding: clamp(1.7rem, 4vw, 2.6rem);
    border-radius: 22px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(135%);
    -webkit-backdrop-filter: blur(22px) saturate(135%);
    box-shadow:
        0 28px 70px rgba(2, 3, 12, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: opacity 0.45s ease, transform 0.45s ease, border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
}

.register-card:hover, .register-card:focus-within {
    border-color: rgba(160, 255, 255, 0.4);
    box-shadow:
        0 28px 70px rgba(2, 3, 12, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 0 30px rgba(160, 255, 255, 0.12);
}

.register-card.submitting {
    opacity: 0;
    transform: translateY(-14px) scale(0.985);
}

.card-title {
    font-size: clamp(1.42rem, 3.4vw, 1.78rem);
    font-weight: 700;
    line-height: 1.28;
    letter-spacing: -0.015em;
    margin-bottom: 0.55rem;
}

.card-subtitle {
    font-size: 0.96rem;
    color: var(--border-muted);
    margin-bottom: 1.85rem;
}

/* ---------- Form ---------- */
.field { margin-bottom: 1.05rem; }

.field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--border-muted);
    margin-bottom: 0.42rem;
}

.field input {
    width: 100%;
    padding: 0.78rem 0.95rem;
    font-family: inherit;
    font-size: 0.97rem;
    color: var(--text-light);
    background: var(--field-bg);
    border: 1px solid rgba(194, 178, 128, 0.22);
    border-radius: 11px;
    transition: border-color 0.22s ease-in-out, box-shadow 0.22s ease-in-out, background 0.22s ease-in-out;
}

.field input::placeholder { color: var(--border-muted); opacity: 0.65; }

.field input:focus {
    outline: none;
    border-color: rgba(160, 255, 255, 0.75);
    background: rgba(38, 38, 38, 0.92);
    box-shadow: 0 0 0 3px rgba(160, 255, 255, 0.2), 0 0 16px rgba(160, 255, 255, 0.25);
}

.field.invalid input {
    border-color: rgba(224, 132, 107, 0.75);
}

.field.invalid input:focus {
    box-shadow: 0 0 0 3px rgba(224, 132, 107, 0.2);
}

.field-error {
    display: none;
    font-size: 0.8rem;
    color: var(--state-danger);
    margin-top: 0.34rem;
}

.field.invalid .field-error { display: block; }

/* ---------- Server-side form alert ---------- */
.form-alert {
    margin: 0 0 1rem;
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    line-height: 1.4;
    border-radius: 10px;
    border: 1px solid var(--state-danger);
    color: var(--state-danger);
    background: rgba(255, 90, 90, 0.08);
}
.form-alert.ok {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: rgba(160, 255, 255, 0.08);
}
.field.hidden { display: none; }

/* ---------- Submit ---------- */
.submit-btn {
    width: 100%;
    margin-top: 0.7rem;
    padding: 0.88rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: var(--bg-dark);
    background: linear-gradient(100deg, var(--accent-cyan) 0%, #C6FFFF 52%, var(--accent-cyan) 100%);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(160, 255, 255, 0.28);
    transition: transform 0.18s ease-in-out, box-shadow 0.25s ease-in-out, filter 0.25s ease-in-out;
}

.submit-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
    box-shadow: 0 16px 38px rgba(160, 255, 255, 0.4);
}

.submit-btn:active {
    transform: translateY(0);
    filter: brightness(0.96);
    box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
}

.submit-btn:focus-visible {
    outline: 2px solid var(--state-warning);
    outline-offset: 3px;
}

.submit-btn:disabled {
    cursor: default;
    filter: saturate(0.7) brightness(0.9);
    transform: none;
}

.submit-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.22s ease;
}

.submit-btn:hover svg { transform: translateX(3px); }

/* ---------- Footer link ---------- */
.card-footer {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--border-muted);
}

.card-footer a {
    color: var(--accent-cyan);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.25s ease-in-out, text-shadow 0.25s ease-in-out;
}

.card-footer a:hover,
.card-footer a:focus-visible {
    text-decoration: underline;
    text-shadow: 0 0 10px rgba(160, 255, 255, 0.6);
}

@media (max-width: 480px) {
    .hero-panel { padding: 2.25rem 1.1rem; }
    .form-panel { padding: 1.1rem 1.1rem 3rem; }
}

@media (prefers-reduced-motion: reduce) {
    .register-card,
    .submit-btn,
    .submit-btn svg { transition: none; }

    .hero-logo, .hero-brand-name, .login-link, .register-card, .field, .submit-btn, .card-footer {
        animation: none;
    }
}
</style>
</head>
<body>

<div class="ambient"></div>
<canvas id="letter-field" aria-hidden="true"></canvas>

<div class="auth-shell">
    <section class="hero-panel">
        <a class="hero-brand-link" href="/" aria-label="Ana səhifəyə qayıt">
            <img class="hero-logo" src="/static/assets/logo_1.png" alt="Azişarə">
            <h2 class="hero-brand-name">Az<span class="accent">İşarə</span></h2>
        </a>
    </section>

    <section class="form-panel">
        <a class="login-link" id="header-auth-link" href="/login">Daxil ol</a>

        <section class="register-card" id="register-card">
            <h1 class="card-title" id="card-title">Azİşarə Platformasında Qeydiyyat</h1>
            <p class="card-subtitle" id="card-subtitle">
                Hesabınızı yaradın və real vaxt rejimində işarə dilini öyrənməyə başlayın.
            </p>

            <p class="form-alert" id="form-alert" role="alert" hidden></p>

            <form id="register-form" novalidate>
                <div class="field" id="field-name">
                    <label for="fullname">Ad və Soyad</label>
                    <input type="text" id="fullname" name="fullname" autocomplete="name"
                           placeholder="Məsələn: Aygün Məmmədova">
                    <p class="field-error" id="error-name">Ad və Soyad daxil edilməlidir.</p>
                </div>

                <div class="field" id="field-email">
                    <label for="email">E-poçt</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                           placeholder="ad@numune.az">
                    <p class="field-error" id="error-email">Düzgün e-poçt ünvanı daxil edin.</p>
                </div>

                <div class="field" id="field-password">
                    <label for="password">Şifrə</label>
                    <input type="password" id="password" name="password" autocomplete="new-password"
                           placeholder="Ən azı 6 simvol">
                    <p class="field-error" id="error-password">Şifrə ən azı 6 simvoldan ibarət olmalıdır.</p>
                </div>

                <div class="field" id="field-confirm">
                    <label for="confirm">Şifrənin təsdiqi</label>
                    <input type="password" id="confirm" name="confirm" autocomplete="new-password"
                           placeholder="Şifrəni təkrar daxil edin">
                    <p class="field-error" id="error-confirm">Şifrələr uyğun gəlmir.</p>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="submit-label">Qeydiyyatı Tamamla</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h13"/>
                        <path d="M12.5 5.5 19 12l-6.5 6.5"/>
                    </svg>
                </button>
            </form>

            <p class="card-footer" id="card-footer">
                Artıq hesabınız var? <a href="/login">Daxil olun</a>
            </p>
        </section>
    </section>
</div>

<script>
(function () {
    'use strict';

    /* Where the user lands after a successful registration.
       '/app' is the existing, already-working CV workspace. */
    var APP_URL = '/app';

    /* ===================================================================
     * Background: chaotic drifting Azerbaijani letters & words
     * =================================================================== */
    var CHARS = ['ə', 'ı', 'ö', 'ü', 'ç', 'ş', 'ğ', 'A', 'B', 'C', 'Ç', 'D',
                 'E', 'Ə', 'G', 'Ğ', 'H', 'X', 'I', 'İ', 'K', 'Q', 'L', 'M',
                 'N', 'O', 'Ö', 'S', 'Ş', 'T', 'U', 'Ü', 'Y', 'Z'];
    var WORDS = ['Salam', 'Təşəkkür', 'Öyrən', 'İşarə', 'Dil',
                 'Ünsiyyət', 'Danış', 'Mənimsə'];

    var canvas = document.getElementById('letter-field');
    var ctx = canvas.getContext('2d');
    var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var particles = [];
    var width = 0, height = 0, dpr = 1;

    function rand(min, max) { return min + Math.random() * (max - min); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function makeParticle(seeded) {
        var isWord = Math.random() < 0.3;
        var size = isWord ? rand(15, 30) : rand(18, 54);
        return {
            text: isWord ? pick(WORDS) : pick(CHARS),
            x: seeded ? rand(0, width) : rand(-80, width + 80),
            y: seeded ? rand(0, height) : rand(-80, height + 80),
            size: size,
            /* independent drift in a random direction */
            vx: rand(-0.34, 0.34),
            vy: rand(-0.34, 0.34),
            angle: rand(-Math.PI, Math.PI),
            spin: rand(-0.0022, 0.0022),
            baseAlpha: isWord ? rand(0.05, 0.11) : rand(0.05, 0.14),
            pulseAmp: rand(0.25, 0.6),
            pulseSpeed: rand(0.00035, 0.0011),
            pulsePhase: rand(0, Math.PI * 2),
            hue: Math.random() < 0.68 ? 'cyan' : 'yellow',
            weight: isWord ? 600 : 500
        };
    }

    function particleCount() {
        var area = width * height;
        return Math.max(26, Math.min(88, Math.round(area / 15000)));
    }

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var target = particleCount();
        while (particles.length < target) particles.push(makeParticle(true));
        if (particles.length > target) particles.length = target;
    }

    function wrap(p) {
        var pad = 120;
        if (p.x < -pad) p.x = width + pad;
        else if (p.x > width + pad) p.x = -pad;
        if (p.y < -pad) p.y = height + pad;
        else if (p.y > height + pad) p.y = -pad;
    }

    function draw(now) {
        ctx.clearRect(0, 0, width, height);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];

            if (!reduceMotion) {
                p.x += p.vx;
                p.y += p.vy;
                p.angle += p.spin;
                wrap(p);
            }

            var pulse = 1 + p.pulseAmp * Math.sin(now * p.pulseSpeed + p.pulsePhase);
            var alpha = Math.max(0, p.baseAlpha * pulse);

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.font = p.weight + ' ' + p.size.toFixed(1) + "px 'Segoe UI', Tahoma, sans-serif";
            ctx.fillStyle = p.hue === 'cyan'
                ? 'rgba(160, 255, 255, ' + alpha.toFixed(3) + ')'
                : 'rgba(255, 204, 0, ' + alpha.toFixed(3) + ')';
            ctx.fillText(p.text, 0, 0);
            ctx.restore();
        }
    }

    var rafId = null;
    function loop(now) {
        draw(now);
        rafId = window.requestAnimationFrame(loop);
    }

    function start() {
        if (rafId === null) rafId = window.requestAnimationFrame(loop);
    }
    function stop() {
        if (rafId !== null) {
            window.cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    resize();
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) stop(); else start();
    });
    start();

    /* ===================================================================
     * Registration form: client-side validation + redirect
     * =================================================================== */
    var form = document.getElementById('register-form');
    var card = document.getElementById('register-card');
    var submitBtn = document.getElementById('submit-btn');
    var submitLabel = document.getElementById('submit-label');
    var formAlert = document.getElementById('form-alert');
    var cardTitle = document.getElementById('card-title');
    var cardSubtitle = document.getElementById('card-subtitle');
    var cardFooter = document.getElementById('card-footer');
    var headerAuthLink = document.getElementById('header-auth-link');

    var fields = {
        name:     { wrap: document.getElementById('field-name'),     input: document.getElementById('fullname') },
        email:    { wrap: document.getElementById('field-email'),    input: document.getElementById('email') },
        password: { wrap: document.getElementById('field-password'), input: document.getElementById('password') },
        confirm:  { wrap: document.getElementById('field-confirm'),  input: document.getElementById('confirm') }
    };

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    /* "login" when the page is served at /login, otherwise "register".
       Both URLs return this same HTML; the backend switches nothing. */
    var MODE = window.location.pathname.replace(/\/+$/, '') === '/login'
        ? 'login' : 'register';

    var COPY = {
        register: {
            title: 'Azİşarə Platformasında Qeydiyyat',
            subtitle: 'Hesabınızı yaradın və real vaxt rejimində işarə dilini öyrənməyə başlayın.',
            submit: 'Qeydiyyatı Tamamla',
            footerHtml: 'Artıq hesabınız var? <a href="/login">Daxil olun</a>',
            headerLink: { text: 'Daxil ol', href: '/login' },
            endpoint: '/api/register'
        },
        login: {
            title: 'Azİşarə Platformasına Daxil ol',
            subtitle: 'E-poçt və şifrənizlə hesabınıza daxil olun.',
            submit: 'Daxil ol',
            footerHtml: 'Hesabınız yoxdur? <a href="/register">Qeydiyyatdan keçin</a>',
            headerLink: { text: 'Qeydiyyat', href: '/register' },
            endpoint: '/api/login'
        }
    };

    function applyMode() {
        var c = COPY[MODE];
        cardTitle.textContent = c.title;
        cardSubtitle.textContent = c.subtitle;
        submitLabel.textContent = c.submit;
        cardFooter.innerHTML = c.footerHtml;
        if (headerAuthLink) {
            headerAuthLink.textContent = c.headerLink.text;
            headerAuthLink.setAttribute('href', c.headerLink.href);
        }
        document.title = c.title;
        // Name + confirm only exist for registration.
        var loginMode = MODE === 'login';
        fields.name.wrap.classList.toggle('hidden', loginMode);
        fields.confirm.wrap.classList.toggle('hidden', loginMode);
        fields.password.input.setAttribute(
            'autocomplete', loginMode ? 'current-password' : 'new-password'
        );
    }

    function showAlert(message, ok) {
        formAlert.textContent = message;
        formAlert.classList.toggle('ok', !!ok);
        formAlert.hidden = false;
    }
    function clearAlert() { formAlert.hidden = true; formAlert.textContent = ''; }

    function setError(key, message) {
        var f = fields[key];
        f.wrap.classList.add('invalid');
        f.input.setAttribute('aria-invalid', 'true');
        if (message) {
            f.wrap.querySelector('.field-error').textContent = message;
        }
    }

    function clearError(key) {
        var f = fields[key];
        f.wrap.classList.remove('invalid');
        f.input.removeAttribute('aria-invalid');
    }

    function validate() {
        var firstInvalid = null;
        var loginMode = MODE === 'login';

        if (!loginMode) {
            var name = fields.name.input.value.trim();
            if (name.length < 2) {
                setError('name', 'Ad və Soyad daxil edilməlidir.');
                firstInvalid = firstInvalid || fields.name.input;
            } else {
                clearError('name');
            }
        }

        var email = fields.email.input.value.trim();
        if (!EMAIL_RE.test(email)) {
            setError('email', 'Düzgün e-poçt ünvanı daxil edin.');
            firstInvalid = firstInvalid || fields.email.input;
        } else {
            clearError('email');
        }

        var password = fields.password.input.value;
        if (loginMode ? password.length === 0 : password.length < 6) {
            setError('password', loginMode
                ? 'Şifrəni daxil edin.'
                : 'Şifrə ən azı 6 simvoldan ibarət olmalıdır.');
            firstInvalid = firstInvalid || fields.password.input;
        } else {
            clearError('password');
        }

        if (!loginMode) {
            var confirm = fields.confirm.input.value;
            if (confirm.length === 0) {
                setError('confirm', 'Şifrənin təsdiqi daxil edilməlidir.');
                firstInvalid = firstInvalid || fields.confirm.input;
            } else if (confirm !== password) {
                setError('confirm', 'Şifrələr uyğun gəlmir.');
                firstInvalid = firstInvalid || fields.confirm.input;
            } else {
                clearError('confirm');
            }
        }

        return firstInvalid;
    }

    /* Re-validate a touched field once the user starts fixing it. */
    Object.keys(fields).forEach(function (key) {
        fields[key].input.addEventListener('input', function () {
            if (fields[key].wrap.classList.contains('invalid')) validate();
        });
    });

    function extractError(payload, fallback) {
        if (!payload) return fallback;
        var d = payload.detail;
        if (typeof d === 'string') return d;
        if (Array.isArray(d) && d.length && d[0] && d[0].msg) {
            return String(d[0].msg).replace(/^Value error,\s*/, '');
        }
        return fallback;
    }

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearAlert();

        var firstInvalid = validate();
        if (firstInvalid) {
            firstInvalid.focus();
            return;
        }

        var loginMode = MODE === 'login';
        var body = loginMode
            ? {
                email: fields.email.input.value.trim(),
                password: fields.password.input.value
              }
            : {
                full_name: fields.name.input.value.trim(),
                email: fields.email.input.value.trim(),
                password: fields.password.input.value,
                confirm: fields.confirm.input.value
              };

        submitBtn.disabled = true;
        submitLabel.textContent = 'Gözləyin...';

        fetch(COPY[MODE].endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(body)
        })
        .then(function (res) {
            return res.json().catch(function () { return null; }).then(function (data) {
                return { ok: res.ok, status: res.status, data: data };
            });
        })
        .then(function (r) {
            if (r.ok) {
                submitLabel.textContent = 'Yönləndirilir...';
                card.classList.add('submitting');
                window.setTimeout(function () {
                    window.location.href = APP_URL;
                }, reduceMotion ? 0 : 420);
                return;
            }
            submitBtn.disabled = false;
            submitLabel.textContent = COPY[MODE].submit;
            var msg = extractError(r.data,
                loginMode ? 'Daxil olmaq alınmadı.' : 'Qeydiyyat alınmadı.');
            if (r.status === 409) { setError('email', msg); }
            showAlert(msg, false);
        })
        .catch(function () {
            submitBtn.disabled = false;
            submitLabel.textContent = COPY[MODE].submit;
            showAlert('Serverə qoşulmaq mümkün olmadı. Backend işləyirmi?', false);
        });
    });

    applyMode();
})();
</script>

</body>
</html>
