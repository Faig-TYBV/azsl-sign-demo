# Render blueprint for the recognition backend.
# Render Dashboard -> New -> Blueprint -> point at this repo.
#
# PLAN: measured need is ~300 MB idle + ~50 MB per concurrent viewer, so the
# free plan's 512 MB fits 3-4 people. Its 0.1 CPU caps throughput at ~8 fps
# (a 26-frame word trial takes ~3.3 s instead of ~1.7 s) and it sleeps after
# 15 minutes idle (~50 s cold start). Upgrade to "starter" to lift the fps cap.
services:
  - type: web
    name: azsl-recognition
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Same Neon database as Vercel. Friends/chat live in the same database as
      # the accounts, so both hosts must point at it.
      - key: DATABASE_URL
        sync: false
      # MUST match the Vercel value — it verifies the /ws and /ws/social tokens
      # Vercel issues.
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Optional WebRTC relay for friend calls. Empty = STUN only, which
      # connects most users; set all three in the Render dashboard to also
      # reach people behind symmetric NAT (mobile data, corporate firewalls).
      # See the TURN section of DEPLOY_RECOGNITION.md.
      - key: TURN_URL
        value: ""
      - key: TURN_USERNAME
        value: ""
      - key: TURN_CREDENTIAL
        value: ""
